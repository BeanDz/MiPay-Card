# yaml-language-server: $schema=https://alint.org/_alint/configuration/schema.json
version: 1

extends:
  - url: alint://bundled/agent-hygiene@v1
    only:
      - agent-no-versioned-duplicates
      - agent-no-scratch-docs-at-root

rules:
  - id: project-readme
    kind: file_exists
    paths: README.md
    root_only: true
    level: error
    message: Keep the project summary available.

  - id: project-agent-instructions
    kind: file_exists
    paths: AGENTS.md
    root_only: true
    level: error
    message: Keep repository instructions available.

  - id: final-newline
    kind: final_newline
    paths: ["**/*.{kt,kts,md,xml,toml,yml,yaml,properties,sh}"]
    level: error

  - id: trailing-whitespace
    kind: no_trailing_whitespace
    paths: ["**/*.{kt,kts,md,xml,toml,yml,yaml,properties,sh}"]
    level: error

  - id: merge-conflicts
    kind: no_merge_conflict_markers
    paths: ["**/*.{kt,kts,md,xml,toml,yml,yaml,properties,sh}"]
    level: error

  - id: local-android-files
    kind: file_absent
    paths: [local.properties, "**/*.apk", "**/*.aab", "**/*.jks", "**/*.keystore"]
    level: error
    message: Keep local Android configuration and build artifacts out of version control.
