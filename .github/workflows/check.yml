name: Android checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
      - uses: jdx/mise-action@v5
      - run: mise run setup
      - run: mise run check
      - run: mise run build
